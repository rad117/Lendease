{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="narrow stack">
  <h1>Create your account</h1>
  <form method="post" class="card form stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" value="{{ form.get('full_name', '') }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" minlength="8" required>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="8" required>
    <button class="btn btn-primary" type="submit">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</section>
{% endblock %}
